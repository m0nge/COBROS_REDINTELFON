services:
  cobranza-red:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Configure VITE_SUPABASE_URL in Coolify}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Configure VITE_SUPABASE_ANON_KEY in Coolify}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL in Coolify}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Configure SUPABASE_SERVICE_ROLE_KEY in Coolify}
      SAP_API_KEY: ${SAP_API_KEY:?Configure SAP_API_KEY in Coolify}
      SAN_API_KEY: ${SAN_API_KEY:?Configure SAN_API_KEY in Coolify}
      CRON_SECRET: ${CRON_SECRET:?Configure CRON_SECRET in Coolify}
      CLIENTES_SYNC_TOKEN: ${CLIENTES_SYNC_TOKEN:-}
      PBX_API_USERNAME: ${PBX_API_USERNAME:-}
      PBX_API_PASSWORD: ${PBX_API_PASSWORD:-}
      RECLAMOS_API_KEY: ${RECLAMOS_API_KEY:-}
